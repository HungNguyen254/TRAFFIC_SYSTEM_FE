<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hà Nội Traffic AI – Hệ thống Giám sát & Dự báo Giao thông Thông minh</title>
  <meta name="description"
    content="Hệ thống phân tích, mô phỏng và dự báo ùn tắc giao thông thông minh thời gian thực tại Hà Nội bằng mô hình trí tuệ nhân tạo." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <!-- Anti-FOUC: áp theme đã lưu TRƯỚC khi CSS render (tránh chớp trắng khi reload) -->
  <script>
    (function(){try{var p=localStorage.getItem("traffic_theme")||"system";var d=p==="dark"||(p!=="light"&&window.matchMedia("(prefers-color-scheme: dark)").matches);var e=document.documentElement;e.setAttribute("data-theme",d?"dark":"light");e.style.colorScheme=d?"dark":"light";}catch(e){}})();
  </script>

  <!-- Application CSS -->
  <link rel="stylesheet" href="/src/css/main.css" />
  <link rel="stylesheet" href="/src/css/map.css" />
  <link rel="stylesheet" href="/src/css/chatbot.css" />
</head>

<body>
  <div id="app"></div>

  <!-- Main Application Entrypoint (Leaflet & Chart.js bundled via NPM) -->
  <script type="module" src="/src/js/main.js"></script>
</body>

</html>
